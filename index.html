<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKR Live Exchange Rates</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            color: #1f2937;
            margin-bottom: 30px;
            font-size: 28px;
            text-align: center;
        }

        .window-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 800px;
        }

        .currency-window {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .region-tag {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .eur-tag { color: #2563eb; }
        .usd-tag { color: #16a34a; }

        h2 {
            color: #4b5563;
            margin: 0 0 20px 0;
            font-size: 20px;
        }

        .rate-display {
            font-size: 34px;
            font-weight: 800;
            color: #111827;
            margin: 20px 0;
        }

        .error-text {
            color: #dc2626;
            font-size: 16px;
            font-weight: normal;
        }

        button {
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
            color: white;
        }

        .eur-btn { background-color: #2563eb; }
        .eur-btn:hover { background-color: #1d4ed8; }

        .usd-btn { background-color: #16a34a; }
        .usd-btn:hover { background-color: #15803d; }
    </style>
</head>
<body>

    <h1>Live Exchange Rates (LKR)</h1>

    <div class="window-container">
        
        <!-- Window 1: Euro -->
        <div class="currency-window">
            <div>
                <div class="region-tag eur-tag">Eurozone</div>
                <h2>EUR to LKR</h2>
                <div id="eur-rate" class="rate-display">Fetching...</div>
            </div>
            <button class="eur-btn" onclick="updateSingleRate('EUR', 'eur-rate')">Refresh Euro</button>
        </div>

        <!-- Window 2: US Dollar -->
        <div class="currency-window">
            <div>
                <div class="region-tag usd-tag">United States</div>
                <h2>USD to LKR</h2>
                <div id="usd-rate" class="rate-display">Fetching...</div>
            </div>
            <button class="usd-btn" onclick="updateSingleRate('USD', 'usd-rate')">Refresh Dollar</button>
        </div>

    </div>

    <script>
        function updateSingleRate(fromCurrency, outputElementId) {
            const outputBox = document.getElementById(outputElementId);
            outputBox.innerText = "Updating...";
            outputBox.classList.remove('error-text');

            // Using V4 fallback endpoint which handles CORS issues better in native browsers
            const apiUrl = `https://exchangerate-api.com{fromCurrency}`;

            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) throw new Error("HTTP connection error");
                    return response.json();
                })
                .then(data => {
                    if (data && data.rates && data.rates.LKR) {
                        const directRate = data.rates.LKR;
                        
                        // Output formatted text
                        outputBox.innerText = directRate.toLocaleString('en-US', {
                            minimumFractionDigits: 2,
                            maximumFractionDigits: 2
                        }) + " LKR";
                    } else {
                        throw new Error("Invalid format");
                    }
                })
                .catch(error => {
                    outputBox.innerHTML = "<span class='error-text'>Connection Blocked<br><small style='font-size:11px;color:#9ca3af;'>Check internet connection</small></span>";
                    console.error("Fetch Exception:", error);
                });
        }

        // Auto-run when browser loads
        window.addEventListener('DOMContentLoaded', () => {
            updateSingleRate('EUR', 'eur-rate');
            updateSingleRate('USD', 'usd-rate');
        });
    </script>
</body>
</html>

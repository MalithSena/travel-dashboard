<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live LKR Exchange Rates</title>
    <!-- Tailwind CSS for modern look -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-6">

    <h1 class="text-3xl font-bold text-gray-800 mb-8 text-center">Live Exchange Rates (LKR)</h1>

    <!-- Grid Layout: Split into two window panes -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-4xl">
        
        <!-- Window 1: Euro to LKR -->
        <div class="bg-white rounded-2xl shadow-md p-8 border border-gray-200 text-center flex flex-col justify-between">
            <div>
                <div class="text-sm font-semibold text-blue-600 uppercase tracking-wider mb-2">European Union</div>
                <h2 class="text-2xl font-bold text-gray-700 mb-6">EUR to LKR</h2>
                <div id="eur-rate" class="text-4xl font-extrabold text-gray-900 my-4 tracking-tight">Fetching...</div>
            </div>
            <button onclick="fetchRate('EUR', 'eur-rate')" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-xl transition duration-200">
                Refresh Euro
            </button>
        </div>

        <!-- Window 2: USD to LKR -->
        <div class="bg-white rounded-2xl shadow-md p-8 border border-gray-200 text-center flex flex-col justify-between">
            <div>
                <div class="text-sm font-semibold text-green-600 uppercase tracking-wider mb-2">United States</div>
                <h2 class="text-2xl font-bold text-gray-700 mb-6">USD to LKR</h2>
                <div id="usd-rate" class="text-4xl font-extrabold text-gray-900 my-4 tracking-tight">Fetching...</div>
            </div>
            <button onclick="fetchRate('USD', 'usd-rate')" class="mt-6 w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2.5 px-4 rounded-xl transition duration-200">
                Refresh Dollar
            </button>
        </div>

    </div>

    <script>
        // JavaScript logic to query the free open API
        async function fetchRate(fromCurrency, elementId) {
            const displayElement = document.getElementById(elementId);
            displayElement.innerText = "Updating...";
            displayElement.classList.remove('text-red-500');
            displayElement.classList.add('text-gray-900');

            try {
                const response = await fetch(`https://er-api.com{fromCurrency}`);
                if (!response.ok) throw new Error('Network error');
                
                const data = await response.json();
                
                if (data.result === "success") {
                    const rate = data.rates.LKR;
                    // Format number to 2 decimal places with commas (e.g., 324.50)
                    displayElement.innerText = rate.toLocaleString('en-US', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }) + " LKR";
                } else {
                    throw new Error('API Error');
                }
            } catch (error) {
                displayElement.innerText = "Error Fetching";
                displayElement.classList.remove('text-gray-900');
                displayElement.classList.add('text-red-500');
            }
        }

        // Run both windows automatically when the browser page finishes loading
        window.onload = () => {
            fetchRate('EUR', 'eur-rate');
            fetchRate('USD', 'usd-rate');
        };
    </script>
</body>
</html>
